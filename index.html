<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<title>SISTEMA DESTRUÍDO</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;width:100%;position:fixed;overflow:hidden;
    background:#000;font-family:'Courier New',monospace;cursor:none;
    touch-action:none;overscroll-behavior:none;top:0;left:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  #fx{position:fixed;inset:0;z-index:0;pointer-events:none;}
  #lock-screen{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:100%;height:100%;padding:20px;text-align:center;
    animation:shake 0.08s infinite;
  }
  @keyframes shake{
    0%{transform:translate(0,0);}25%{transform:translate(-8px,6px);}
    50%{transform:translate(7px,-9px);}75%{transform:translate(-6px,-5px);}
    100%{transform:translate(9px,7px);}
  }
  .title{
    font-size:clamp(2.6rem,15vw,8rem);font-weight:900;
    text-transform:uppercase;letter-spacing:4px;margin-bottom:10px;
    text-shadow:0 0 18px #f00,0 0 40px #f00;will-change:transform;
  }
  .subtitle{
    font-size:clamp(1rem,4.5vw,1.6rem);margin-bottom:36px;letter-spacing:3px;
    font-weight:bold;background:#000;color:#0f0;padding:10px 14px;
    border:2px solid #0f0;text-shadow:0 0 8px #0f0;
  }
  .input-area{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    background:#000;padding:18px;border-radius:10px;
    border:4px solid #fff;box-shadow:0 0 80px rgba(255,255,255,.6);
  }
  input[type="password"]{
    background:#000;border:4px solid #0f0;color:#0f0;
    padding:14px;font-size:clamp(1.4rem,6vw,2rem);font-family:inherit;
    text-align:center;border-radius:5px;outline:none;
    width:min(280px,80vw);letter-spacing:10px;caret-color:#0f0;
  }
  button{
    background:#f00;color:#fff;border:2px solid #fff;
    padding:18px 24px;font-size:clamp(1.1rem,4.5vw,1.5rem);
    font-family:inherit;font-weight:900;border-radius:5px;
    width:min(280px,80vw);text-transform:uppercase;letter-spacing:3px;cursor:pointer;
  }
  .footer{
    position:absolute;bottom:10px;font-size:clamp(.9rem,3.5vw,1.3rem);
    color:#0f0;font-weight:900;letter-spacing:4px;
    background:#000;padding:4px 8px;text-shadow:0 0 8px #0f0;
  }
  #start-hint{
    position:fixed;inset:0;z-index:9998;background:#000;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;
    color:#f00;font-size:clamp(1.2rem,6vw,2.2rem);font-weight:900;
    text-align:center;padding:24px;cursor:pointer;letter-spacing:3px;
    animation:pulse 0.9s infinite alternate;
  }
  @keyframes pulse{from{opacity:.35;}to{opacity:1;}}

  #scare-overlay{
    position:fixed;inset:0;z-index:9999;background:#000;
    display:none;align-items:center;justify-content:center;
    color:#f00;font-family:inherit;font-weight:900;
    font-size:clamp(1.4rem,7vw,3rem);text-align:center;padding:24px;
    letter-spacing:3px;text-shadow:0 0 20px #f00;
    animation:scareFlash 0.08s infinite alternate;
  }
  @keyframes scareFlash{
    from{background:#000;color:#f00;}to{background:#f00;color:#000;}
  }

  #devtools-lock{
    position:fixed;inset:0;z-index:10000;background:#000;
    display:none;align-items:center;justify-content:center;flex-direction:column;
    color:#f00;font-family:'Courier New',monospace;font-weight:900;
    font-size:clamp(1.6rem,8vw,3.5rem);text-align:center;padding:24px;
    letter-spacing:4px;text-shadow:0 0 30px #f00;
    animation:scareFlash 0.1s infinite alternate;
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div id="start-hint">
  <div>TOQUE PARA INICIAR</div>
  <div style="font-size:.5em;color:#0f0;letter-spacing:2px;">▶ áudio · voz · fullscreen · cursor travado</div>
</div>
<div id="scare-overlay"></div>
<div id="devtools-lock">
  <div>FECHE O DEVTOOLS</div>
  <div style="font-size:.45em;margin-top:20px;color:#0f0;">para continuar</div>
</div>

<div id="lock-screen">
  <div class="title" id="glitch-title">SISTEMA DESTRUÍDO</div>
  <div class="subtitle">DESBLOQUEIE PARA SALVAR</div>
  <div class="input-area">
    <input type="password" id="senhaInput" autocomplete="off" inputmode="text">
    <button id="btnDesbloquear">SALVAR</button>
  </div>
  <div class="footer">Feito por: Davi chukitos</div>
</div>

<script>
(function(){
  'use strict';

  const SENHA_CORRETA = "CHUKITOS";
  const input     = document.getElementById('senhaInput');
  const btn       = document.getElementById('btnDesbloquear');
  const titleEl   = document.getElementById('glitch-title');
  const fx        = document.getElementById('fx');
  const startHint = document.getElementById('start-hint');
  const overlay   = document.getElementById('scare-overlay');
  const dtLock    = document.getElementById('devtools-lock');
  const ctx       = fx.getContext('2d', { alpha: false });

  let audioCtx=null, master=null, nodes=[];
  let wakeLock=null;
  let started=false, t0=0;
  let rafId=null;
  let intervals=[];

  // ---------- canvas ----------
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    fx.width  = Math.floor(innerWidth  * dpr);
    fx.height = Math.floor(innerHeight * dpr);
    fx.style.width  = innerWidth  + 'px';
    fx.style.height = innerHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  addEventListener('resize', resize);

  // ---------- AUDIO (6 camadas + pan estéreo) ----------
  function initAudio(){
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    master = audioCtx.createGain();
    master.gain.value = 0.08;
    master.connect(audioCtx.destination);

    // Panners estéreo
    const pL = audioCtx.createStereoPanner(); pL.pan.value = -0.7; pL.connect(master);
    const pR = audioCtx.createStereoPanner(); pR.pan.value =  0.7; pR.connect(master);
    const pM = audioCtx.createStereoPanner(); pM.pan.value =  0.0; pM.connect(master);

    function addOsc(type, freq, gainVal, dest, pan){
      const o = audioCtx.createOscillator();
      o.type = type; o.frequency.value = freq;
      const g = audioCtx.createGain(); g.gain.value = gainVal;
      o.connect(g).connect(dest);
      o.start();
      nodes.push(o);
      return { o, g };
    }

    // Sub 42Hz — terremoto
    addOsc('sine', 42, 0.6, pM);

    // Saw 8kHz + LFO (4k-14k em 7Hz)
    const saw = audioCtx.createOscillator();
    saw.type='sawtooth'; saw.frequency.value=8000;
    const sawG = audioCtx.createGain(); sawG.gain.value=0.35;
    saw.connect(sawG).connect(pM); saw.start(); nodes.push(saw);

    const lfo = audioCtx.createOscillator(); lfo.type='sine'; lfo.frequency.value=7;
    const lfoG = audioCtx.createGain(); lfoG.gain.value=5000;
    lfo.connect(lfoG).connect(saw.frequency); lfo.start(); nodes.push(lfo);

    // Ultra-saw 15kHz (doloroso, quase inaudível)
    addOsc('sawtooth', 15000, 0.12, pL);

    // White noise L
    function noiseBuffer(sr, len){
      const buf = audioCtx.createBuffer(1, sr*len, sr);
      const d = buf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      return buf;
    }
    const wn = audioCtx.createBufferSource();
    wn.buffer = noiseBuffer(audioCtx.sampleRate, 2); wn.loop=true;
    const wnG = audioCtx.createGain(); wnG.gain.value=0.28;
    wn.connect(wnG).connect(pL); wn.start(); nodes.push(wn);

    // Brown noise R (mais grave, "chiado" diferente)
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i=0;i<d.length;i++){
      const w = Math.random()*2-1;
      last = (last + 0.02*w) / 1.02;
      d[i] = last * 3.5;
    }
    const bn = audioCtx.createBufferSource();
    bn.buffer = buf; bn.loop=true;
    const bnG = audioCtx.createGain(); bnG.gain.value=0.4;
    bn.connect(bnG).connect(pR); bn.start(); nodes.push(bn);
  }

  function pararAudio(){
    try{
      nodes.forEach(n => { try{ n.stop(); }catch(e){} });
      if (audioCtx) audioCtx.close();
    }catch(e){}
    nodes=[]; audioCtx=null; master=null;
  }

  // ---------- TTS ----------
  function carregarVozes(){
    if ('speechSynthesis' in window && speechSynthesis.getVoices().length === 0){
      speechSynthesis.onvoiceschanged = () => {};
    }
  }
  carregarVozes();

  const FRASES = [
    "VOCÊ FOI HACKEADO PELO CHUKITOS.",
    "DESBLOQUEIE PARA SALVAR O SISTEMA.",
    "SEUS ARQUIVOS ESTÃO SENDO ENVIADOS.",
    "ERRO CRÍTICO DETECTADO.",
    "A SENHA CORRETA É A SUA ÚNICA SAÍDA."
  ];
  let fraseIdx = 0;

  function gritar(texto){
    if (!('speechSynthesis' in window)) return;
    try{
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = 'pt-BR';
      u.volume = 1;
      u.rate = 0.85;
      u.pitch = 0.3;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  // ---------- WAKE LOCK ----------
  async function travarTela(){
    try{
      if ('wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    }catch(e){}
  }
  async function liberarTela(){
    try{ if(wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){}
  }

  // ---------- VIBRAÇÃO ----------
  function iniciarVibracao(){
    if (!('vibrate' in navigator)) return;
    const p = [1400,60,1400,60,1400,500];
    navigator.vibrate(p);
    intervals.push(setInterval(() => navigator.vibrate(p), 2400));
  }
  function pararVibracao(){
    if ('vibrate' in navigator) navigator.vibrate(0);
  }

  // ---------- FULLSCREEN ----------
  function forcarFullscreen(){
    const el = document.documentElement;
    const r = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (r){ try{ r.call(el).catch(()=>{}); }catch(e){} }
  }
  function sairFullscreen(){
    try{
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }catch(e){}
  }

  // ---------- POINTER LOCK ----------
  function travarCursor(){
    if (!document.body.requestPointerLock) return;
    try{ document.body.requestPointerLock(); }catch(e){}
  }
  function liberarCursor(){
    try{ if (document.pointerLockElement) document.exitPointerLock(); }catch(e){}
  }

  // ---------- ORIENTATION LOCK ----------
  function travarOrientacao(){
    try{
      if (screen.orientation && screen.orientation.lock){
        screen.orientation.lock('portrait').catch(()=>{});
      }
    }catch(e){}
  }

  // ---------- FX ----------
  const CHARS = "XØ¥§€£∆©®™#%&*█▓▒░";
  const TITLE = "SISTEMA DESTRUÍDO";
  let glitchTitle = TITLE, nextTitleAt = 0;

  function drawFx(now){
    if (!started) return;
    const W = innerWidth, H = innerHeight;
    const t = (now - t0) / 1000;

    // Pass 1: flash
    const hue = (t * 340) % 360;
    const flash = Math.sin(t*22) > 0;
    ctx.fillStyle = flash ? `hsl(${hue},100%,62%)` : `hsl(${hue},100%,4%)`;
    ctx.fillRect(0,0,W,H);

    // Pass 2: scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    for (let y=(t*300|0)%3; y<H; y+=3) ctx.fillRect(0,y,W,1);

    // Pass 3: RGB split blocks
    for (let i=0;i<14;i++){
      const bw=40+Math.random()*320, bh=2+Math.random()*34;
      const bx=Math.random()*(W-bw), by=Math.random()*(H-bh);
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle = i%2 ? 'rgba(255,0,0,.5)' : 'rgba(0,255,255,.5)';
      ctx.fillRect(bx+(Math.random()*24-12), by, bw, bh);
      ctx.globalCompositeOperation='source-over';
    }

    // Pass 4: glitch chars
    ctx.font = '14px monospace';
    for (let i=0;i<24;i++){
      ctx.fillStyle = `hsl(${(t*120+i*15)%360},100%,50%)`;
      ctx.fillText(
        CHARS.charAt((Math.random()*CHARS.length)|0),
        Math.random()*W, Math.random()*H
      );
    }

    // Pass 5: anel pulsante
    const r = 60 + Math.sin(t*6) * 30 + (t*30 % 400);
    ctx.strokeStyle = `hsla(0,100%,50%,${Math.max(0,1 - r/500)})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(W/2, H/2, r, 0, Math.PI*2);
    ctx.stroke();

    // Pass 6: corrupção de pixel aleatória
    if (Math.random() < 0.4){
      const n = 20 + (Math.random()*40|0);
      for (let i=0;i<n;i++){
        ctx.fillStyle = Math.random()<0.5 ? '#000' : '#fff';
        ctx.fillRect(Math.random()*W, Math.random()*H, 2 + Math.random()*6, 1 + Math.random()*3);
      }
    }

    // Título glitch
    if (now >= nextTitleAt){
      let s="";
      for (let i=0;i<TITLE.length;i++){
        s += (Math.random()>0.55 && TITLE[i]!==' ')
           ? CHARS.charAt((Math.random()*CHARS.length)|0) : TITLE[i];
      }
      glitchTitle = s; nextTitleAt = now + 33;
    }
    if (titleEl.textContent !== glitchTitle) titleEl.textContent = glitchTitle;

    rafId = requestAnimationFrame(drawFx);
  }

  // ---------- TRAVAS DE SAÍDA ----------
  history.pushState(null, null, location.href);
  window.addEventListener('popstate',  () => history.pushState(null, null, location.href));
  window.addEventListener('hashchange', () => history.pushState(null, null, location.href));
  window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue=''; });
  window.addEventListener('unload', () => { /* nada */ });

  // bfcache kill — se voltar pelo histórico, recarrega
  window.addEventListener('pageshow', (e) => {
    if (e.persisted){ location.reload(); }
  });
  window.addEventListener('pagehide', (e) => {
    e.preventDefault();
  });

  // Keyboard trap total
  window.addEventListener('keydown', (e) => {
    if (!started) return;
    const k = e.key;
    const ctrl = e.ctrlKey || e.metaKey;
    const blocked =
      k === 'F5' || k === 'F11' || k === 'F12' || k === 'Escape' ||
      (ctrl && !e.shiftKey && !e.altKey && ['r','w','t','n','u','s','p','l','k','f'].includes(k.toLowerCase())) ||
      (ctrl && e.shiftKey && ['i','j','c','k','m','n','r','t'].includes(k.toLowerCase())) ||
      (e.altKey && (k === 'F4' || k === 'ArrowLeft' || k === 'ArrowRight'));
    if (blocked){
      e.preventDefault();
      e.stopPropagation();
      if (navigator.vibrate) navigator.vibrate([200]);
      if (k === 'Escape') setTimeout(forcarFullscreen, 30);
    }
    // Tab trap no input
    if (k === 'Tab'){
      e.preventDefault();
      input.focus();
    }
  }, true);

  // Fullscreen change — re-request imediato
  document.addEventListener('fullscreenchange', () => {
    if (started && !document.fullscreenElement) setTimeout(forcarFullscreen, 30);
  });

  // Pointer lock change — re-request
  document.addEventListener('pointerlockchange', () => {
    if (started && !document.pointerLockElement) setTimeout(travarCursor, 200);
  });

  // Visibility — reentra em tudo
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && started){
      setTimeout(forcarFullscreen, 50);
      setTimeout(travarCursor, 100);
      try{ input.focus(); }catch(e){}
      travarTela();
    }
  });

  // Bloqueio de gestos
  ['contextmenu','selectstart','dragstart','copy','cut','paste','beforeinput'].forEach(ev => {
    document.addEventListener(ev, e => {
      if (started && ev !== 'beforeinput') e.preventDefault();
    }, true);
  });
  window.addEventListener('beforeprint', e => { if (started) e.preventDefault(); });
  try{
    matchMedia('print').addEventListener('change', e => {
      if (started && e.matches) e.preventDefault?.();
    });
  }catch(e){}

  // ---------- SUSTOS ----------
  function sustoDownload(nome, conteudo){
    try{
      const blob = new Blob([conteudo], {type:'text/plain'});
      const url  = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download=nome;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }catch(e){}
  }

  const OVERLAY_TXT = [
    "VOCÊ FOI HACKEADO PELO CHUKITOS!",
    "ERRO CRÍTICO: SISTEMA CORROMPIDO",
    "SEUS ARQUIVOS ESTÃO SENDO ENVIADOS…",
    "SENHA '123456' NÃO É SEGURA",
    "DESBLOQUEIE PARA PARAR — DAVI CHUKITOS"
  ];
  let overlayIdx = 0;

  function mostrarSusto(){
    overlay.textContent = OVERLAY_TXT[overlayIdx % OVERLAY_TXT.length];
    overlayIdx++;
    overlay.style.display = 'flex';
    setTimeout(() => { overlay.style.display = 'none'; }, 500);
  }

  const DOWNLOADS = [
    ["VOCE_FOI_HACKEADO.txt", "HACKED BY CHUKITOS\n\nSua senha estava fraca."],
    ["leia_isso_urgente.txt", "Isso é só um susto :)\n\n— Davi chukitos"],
    ["erro_critico.log",      "[CRITICAL] System breached by CHUKITOS\n[INFO] Goodbye."]
  ];
  let dlIdx = 0;

  function rodarSustos(){
    // Audio + vibração + tela acordada imediato
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    iniciarVibracao();
    travarTela();
    travarOrientacao();

    // TTS a cada 3.2s
    intervals.push(setInterval(() => {
      gritar(FRASES[fraseIdx % FRASES.length]);
      fraseIdx++;
    }, 3200));
    // Primeira fala logo
    setTimeout(() => gritar(FRASES[0]), 400);

    // Overlay a cada 1.5s
    intervals.push(setInterval(mostrarSusto, 1500));

    // Downloads em cascata a cada 5s
    intervals.push(setInterval(() => {
      const [n, c] = DOWNLOADS[dlIdx % DOWNLOADS.length];
      dlIdx++;
      sustoDownload(n, c);
    }, 5000));

    // Câmera aos 10s
    setTimeout(() => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      navigator.mediaDevices.getUserMedia({ video:true, audio:false })
        .then(stream => setTimeout(() => stream.getTracks().forEach(t=>t.stop()), 3000))
        .catch(()=>{});
    }, 10000);

    // Focus trap
    intervals.push(setInterval(() => {
      if (started && document.activeElement !== input){
        try{ input.focus(); }catch(e){}
      }
    }, 150));

    // Fullscreen polling 3s
    intervals.push(setInterval(() => {
      if (started && !document.fullscreenElement) forcarFullscreen();
    }, 3000));

    // Pointer lock polling 1s
    intervals.push(setInterval(() => {
      if (started && !document.pointerLockElement) travarCursor();
    }, 1000));

    // Devtools detection
    intervals.push(setInterval(() => {
      if (!started) return;
      const wDiff = window.outerWidth  - window.innerWidth;
      const hDiff = window.outerHeight - window.innerHeight;
      const open = wDiff > 200 || hDiff > 250;
      dtLock.style.display = open ? 'flex' : 'none';
    }, 800));
  }

  // ---------- SENHA ----------
  function checarSenha(){
    const digitada = (input.value || '').toUpperCase().trim();
    if (digitada === SENHA_CORRETA){
      pararTudo();
      document.body.style.cursor = 'default';
      document.body.innerHTML = `
        <div style="display:flex;flex-direction:column;height:100vh;align-items:center;justify-content:center;
                    background:#000;color:#0f0;font-family:monospace;text-align:center;padding:20px;">
          <div style="font-size:3rem;font-weight:900;text-shadow:0 0 20px #0f0;">SALVO.</div>
          <div style="font-size:1.5rem;color:#f00;margin-top:40px;font-weight:bold;">Feito por: Davi chukitos</div>
        </div>`;
    } else {
      input.value = '';
      input.style.borderColor = '#f00';
      setTimeout(() => { input.style.borderColor = '#0f0'; }, 180);
      if (navigator.vibrate) navigator.vibrate([1000]);
      gritar("SENHA INCORRETA. TENTE NOVAMENTE.");
    }
  }

  function pararTudo(){
    started = false;
    if (rafId) cancelAnimationFrame(rafId);
    intervals.forEach(id => { clearInterval(id); clearTimeout(id); });
    intervals = [];
    overlay.style.display = 'none';
    dtLock.style.display = 'none';
    try{ if ('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
    pararAudio();
    pararVibracao();
    liberarTela();
    liberarCursor();
    sairFullscreen();
  }

  // ---------- START ----------
  function iniciar(){
    if (started) return;
    started = true;
    startHint.remove();

    t0 = performance.now();
    forcarFullscreen();
    setTimeout(() => travarCursor(), 200);
    setTimeout(() => travarOrientacao(), 300);

    rafId = requestAnimationFrame(drawFx);
    rodarSustos();
    input.focus();
  }

  startHint.addEventListener('click', iniciar, { once:true });
  startHint.addEventListener('touchstart', iniciar, { once:true, passive:true });

  btn.addEventListener('click', checarSenha);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checarSenha(); });

})();
</script>
</body>
</html>
