<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Falha Crítica do Sistema</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html, body {
    height: 100%; width: 100%; position: fixed; overflow: hidden;
    background: #000; font-family: 'Courier New', monospace; cursor: none;
    touch-action: none; overscroll-behavior: none; margin: 0; top: 0; left: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; user-select: none;
  }
  
  /* Fundo Matrix */
  #matrix {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1; opacity: 0.25;
  }

  /* Efeito de tremedeira e pisca vermelho */
  #lock-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; padding: 20px; text-align: center;
    background: rgba(10, 0, 0, 0.9);
    animation: glitch-bg 0.15s infinite, red-flash 2s infinite;
  }

  @keyframes glitch-bg {
    0% { transform: translate(0,0); }
    10% { transform: translate(-3px, 3px); }
    20% { transform: translate(3px, -3px); }
    30% { transform: translate(0,0); }
    100% { transform: translate(0,0); }
  }

  @keyframes red-flash {
    0%, 100% { background: rgba(10, 0, 0, 0.9); }
    50% { background: rgba(40, 0, 0, 0.9); }
  }

  .title {
    font-size: clamp(2.5rem, 10vw, 5rem); font-weight: 900; color: #ff0000;
    text-transform: uppercase; letter-spacing: 4px; margin-bottom: 10px;
    text-shadow: 0 0 30px red, -5px 5px 0 #0f0, 5px -5px 0 #00f;
    animation: glitch-text 0.1s infinite;
  }

  @keyframes glitch-text {
    0% { text-shadow: 0 0 30px red, -2px 2px 0 #0f0, 2px -2px 0 #00f; }
    50% { text-shadow: 0 0 30px red, 3px -3px 0 #0f0, -3px 3px 0 #00f; }
    100% { text-shadow: 0 0 30px red, -2px 2px 0 #0f0, 2px -2px 0 #00f; }
  }
  
  .subtitle {
    font-size: 1.2rem; color: #aaa; margin-bottom: 40px; letter-spacing: 2px;
    font-weight: bold; animation: blink 0.5s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .input-area {
    display: flex; flex-direction: column; align-items: center; gap: 15px;
    background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px;
    border: 2px solid #ff0000; box-shadow: 0 0 40px rgba(255,0,0,0.5);
  }

  input[type="password"] {
    background: #111; border: 2px solid #00ff00; color: #00ff00;
    padding: 15px; font-size: 1.5rem; font-family: inherit; text-align: center;
    border-radius: 5px; outline: none; width: 250px; letter-spacing: 5px;
    box-shadow: 0 0 15px rgba(0,255,0,0.3);
  }

  input[type="password"]:focus {
    box-shadow: 0 0 25px rgba(0,255,0,0.6);
  }

  button {
    background: #ff0000; color: #fff; border: none; padding: 15px 30px;
    font-size: 1.2rem; font-family: inherit; font-weight: 900; cursor: pointer;
    border-radius: 5px; width: 250px; text-transform: uppercase;
    letter-spacing: 2px; transition: 0.1s;
  }

  button:active { background: #aa0000; transform: scale(0.95); }

  .footer {
    position: absolute; bottom: 30px; font-size: 1rem; color: #ff0000;
    font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 15px red;
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="lock-screen">
  <div class="title" id="glitch-title">SISTEMA BLOQUEADO</div>
  <div class="subtitle">ACESSO NEGADO</div>
  
  <div class="input-area">
    <input type="password" id="senhaInput" autocomplete="off" autofocus>
    <button id="btnDesbloquear">DESBLOQUEAR</button>
  </div>

  <div class="footer">Feito por: Davi chukitos</div>
</div>

<script>
(function(){
  const SENHA_CORRETA = "CHUKITOS";
  const input = document.getElementById('senhaInput');
  const btn = document.getElementById('btnDesbloquear');
  const glitchTitle = document.getElementById('glitch-title');
  
  let audioCtx, osc, lfo;
  let glitchLoop, vibInterval;

  // --- EFEITO MATRIX ---
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const letters = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*";
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = [];
  for (let x = 0; x < columns; x++) drops[x] = 1;

  function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0F0";
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const text = letters.charAt(Math.floor(Math.random() * letters.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(drawMatrix, 33);

  // --- SIRENE E VIBRAÇÃO ---
  function tocarSirene() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth'; 
        osc.frequency.value = 900; // Agudo e insuportável
        lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.value = 10; // Rápido
        lfoGain.gain.value = 500;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        gainNode.gain.value = 0.15; 
        osc.start();
        lfo.start();
      }
    } catch(e) {}
  }

  function vibrar() {
    if ("vibrate" in navigator) {
      vibInterval = setInterval(() => {
        navigator.vibrate([300, 100, 300, 100, 500]); 
      }, 1000);
    }
  }

  function pararTudo() {
    try { if(osc) osc.stop(); if(audioCtx) audioCtx.close(); audioCtx = null; } catch(e) {}
    if ("vibrate" in navigator) { clearInterval(vibInterval); navigator.vibrate(0); }
    clearInterval(glitchLoop);
  }

  // --- GLITCH NO TÍTULO ---
  function iniciarGlitch() {
    const originalText = "SISTEMA BLOQUEADO";
    const chars = "XØ¥§€£∆©®™";
    glitchLoop = setInterval(() => {
      let text = "";
      for(let i=0; i<originalText.length; i++) {
        if(Math.random() > 0.8 && originalText[i] !== " ") {
          text += chars.charAt(Math.floor(Math.random() * chars.length));
        } else {
          text += originalText[i];
        }
      }
      glitchTitle.innerText = text;
    }, 100);
  }

  // --- TRAVA DE TELA E VOLTAR ---
  function forcarTelaCheia() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  history.pushState(null, null, location.href);
  window.onpopstate = function () {
    history.pushState(null, null, location.href);
  };
  
  // --- LÓGICA DA SENHA ---
  function checarSenha() {
    const digitada = input.value.toUpperCase();
    if (digitada === SENHA_CORRETA) {
      pararTudo();
      
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      
      document.body.innerHTML = `
        <div style="display:flex;flex-direction:column;height:100vh;align-items:center;justify-content:center;background:#000;color:#0f0;font-family:monospace;text-align:center;padding:20px;">
          <div style="font-size:3rem; font-weight:900; text-shadow: 0 0 20px #0f0; letter-spacing: 5px;">SISTEMA DESBLOQUEADO</div>
          <div style="font-size:1.2rem;color:#aaa;margin-top:20px;">Você derrotou o CHUKITOS.</div>
          <div style="font-size:1.5rem;color:#f00; margin-top:40px; font-weight:bold; text-shadow: 0 0 10px red;">Feito por: Davi chukitos</div>
        </div>`;
      document.body.style.cursor = 'default';
      document.body.style.background = '#000';
      
    } else {
      input.value = '';
      input.style.borderColor = '#ff0000';
      setTimeout(() => { input.style.borderColor = '#00ff00'; }, 150);
      if (navigator.vibrate) navigator.vibrate([500]); // Tremida forte de erro
    }
  }

  // Inicializa os efeitos na primeira interação
  document.body.addEventListener('click', () => {
    tocarSirene();
    vibrar();
    iniciarGlitch();
    forcarTelaCheia();
  }, { once: true });

  btn.addEventListener('click', checarSenha);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checarSenha();
  });

  // Bloqueia F11 e Ctrl+W no PC
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F11' || e.key === 'F12' || (e.ctrlKey && e.key === 'w') || (e.ctrlKey && e.key === 'W')) {
      e.preventDefault(); 
    }
  });

  setInterval(() => {
    if(document.activeElement !== input) input.focus();
  }, 500);

})();
</script>
</body>
</html>
